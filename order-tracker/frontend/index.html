<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Tracker & Live Support</title>
<style>
  *{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f3f4f8;color:#222}
  header{background:#5b45e0;color:#fff;padding:14px 20px} header h1{margin:0;font-size:20px}
  nav{display:flex;gap:6px;padding:10px 20px;background:#fff;flex-wrap:wrap;border-bottom:1px solid #ddd}
  nav button{padding:8px 14px;border:0;border-radius:6px;background:#e8e6fb;cursor:pointer}
  nav button.active{background:#5b45e0;color:#fff}
  main{max-width:900px;margin:16px auto;padding:0 12px}
  .tab{display:none} .tab.active{display:block}
  .card{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
  input,select{padding:8px;margin:4px 4px 4px 0;border:1px solid #bbb;border-radius:6px}
  button.act{padding:8px 12px;border:0;border-radius:6px;background:#5b45e0;color:#fff;cursor:pointer;margin:2px}
  button.danger{background:#d33} .badge{padding:2px 8px;border-radius:10px;background:#ddd;font-size:12px}
  #custChat,#agentChat{height:220px;overflow:auto;border:1px solid #ccc;border-radius:6px;padding:8px;background:#fafafa;margin:8px 0}
  .msg{margin:4px 0} .msg.agent b{color:#5b45e0} .sys{color:#888;font-style:italic;font-size:13px}
  .alert{padding:6px 10px;border-left:4px solid #5b45e0;background:#f0eeff;margin:4px 0}
  .alert.warning{border-color:#e69500;background:#fff5e0}
  #conn{float:right;font-size:12px}
</style>
</head>
<body>
<header><span id="conn">connecting...</span><h1>Order Tracking & Live Support System</h1></header>
<nav id="nav">
  <button data-tab="shop" class="active">Shop / Place Order</button>
  <button data-tab="track">Track Order + Chat</button>
  <button data-tab="agent">Support Agent</button>
  <button data-tab="alerts">Live Alerts (SSE)</button>
</nav>
<main>
  <section id="shop" class="tab active">
    <div class="card"><h3>Catalog (REST: GET /api/v1/catalog)</h3><div id="catalog"></div></div>
    <div class="card"><h3>Place Order (REST: POST /api/v1/orders)</h3>
      <input id="custName" placeholder="Your name"> <button class="act" onclick="placeOrder()">Place Order</button>
      <p id="orderMsg"></p></div>
  </section>

  <section id="track" class="tab">
    <div class="card"><h3>Track Order (WebSocket live status)</h3>
      <input id="trackId" placeholder="Order ID e.g. 1001" type="number">
      <input id="trackName" placeholder="Your name">
      <button class="act" onclick="trackOrder()">Track & Join Chat</button>
      <button class="act danger" onclick="cancelOrder()">Cancel Order (JSON-RPC)</button>
      <p>Status: <span id="trackStatus" class="badge">-</span></p><p id="rpcMsg"></p></div>
    <div class="card"><h3>Chat with Support</h3><div id="custChat"></div>
      <div id="custTyping" class="sys"></div>
      <input id="custText" placeholder="Type message..." style="width:70%" oninput="typing('cust')" onkeydown="if(event.key==='Enter')sendMsg('cust')">
      <button class="act" onclick="sendMsg('cust')">Send</button></div>
  </section>

  <section id="agent" class="tab">
    <div class="card"><h3>Support Agent Dashboard</h3>
      <button class="act" onclick="agentJoin()">Go Online</button>
      <div id="agentOrders"></div></div>
    <div class="card"><h3>Agent Chat</h3>
      <input id="agentOrderId" placeholder="Order ID" type="number" style="width:110px">
      <button class="act" onclick="agentOpenChat()">Open Chat</button>
      <div id="agentChat"></div><div id="agentTyping" class="sys"></div>
      <input id="agentText" placeholder="Reply..." style="width:70%" oninput="typing('agent')" onkeydown="if(event.key==='Enter')sendMsg('agent')">
      <button class="act" onclick="sendMsg('agent')">Send</button></div>
  </section>

  <section id="alerts" class="tab"><div class="card"><h3>System Alerts (SSE: /events)</h3><div id="alertList"></div></div></section>
</main>

<script src="config.js"></script>
<script>
  const API = window.API_URL;
  // load socket.io client from the backend itself
  const s = document.createElement('script');
  s.src = API + '/socket.io/socket.io.js';
  s.onload = init;
  s.onerror = () => document.getElementById('conn').textContent = 'backend unreachable';
  document.head.appendChild(s);

  let socket, cart = {}, custOrderId = null, custName = '', agentName = 'Support Agent', agentChatOrder = null;
  const $ = id => document.getElementById(id);

  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#nav button').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); $(b.dataset.tab).classList.add('active');
  });

  function init() {
    socket = io(API);
    socket.on('connect', () => $('conn').textContent = 'websocket connected');
    socket.on('disconnect', () => $('conn').textContent = 'disconnected');
    socket.on('order:status', d => { if (d.orderId == custOrderId) $('trackStatus').textContent = d.status; });
    socket.on('chat:message', m => {
      const box = m.role === 'agent' && m.orderId == agentChatOrder && agentActive() ? 'agentChat' : null;
      if (m.orderId == custOrderId) addMsg('custChat', m);
      if (m.orderId == agentChatOrder) addMsg('agentChat', m);
    });
    socket.on('chat:system', m => { addSys('custChat', m.text); addSys('agentChat', m.text); });
    socket.on('chat:typing', d => {
      $('custTyping').textContent = `${d.name} is typing...`; $('agentTyping').textContent = `${d.name} is typing...`;
      setTimeout(() => { $('custTyping').textContent = ''; $('agentTyping').textContent = ''; }, 1200);
    });
    socket.on('agent:ready', d => renderAgentOrders(d.orders));
    socket.on('order:new', () => refreshAgentOrders());
    socket.on('order:updated', () => refreshAgentOrders());
    socket.on('chat:request', d => addSys('agentChat', `Customer ${d.name} started chat on order #${d.orderId}`));
    loadCatalog();
    startSSE();
  }
  function agentActive() { return true; }

  async function loadCatalog() {
    const items = await (await fetch(API + '/api/v1/catalog')).json();
    $('catalog').innerHTML = items.map(p => `<div>${p.name} - Rs ${p.price}
      <input type="number" min="0" value="0" style="width:60px" onchange="cart[${p.id}]=this.value"></div>`).join('');
  }
  async function placeOrder() {
    const name = $('custName').value.trim();
    const items = Object.entries(cart).filter(([, q]) => q > 0).map(([productId, qty]) => ({ productId, qty }));
    if (!name || !items.length) return $('orderMsg').textContent = 'Enter name and at least one quantity.';
    const r = await fetch(API + '/api/v1/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ customerName: name, items }) });
    const o = await r.json();
    $('orderMsg').textContent = r.ok ? `Order placed! Your Order ID is #${o.id} (Total Rs ${o.total})` : o.error;
    if (r.ok) { $('trackId').value = o.id; $('trackName').value = name; }
  }

  function trackOrder() {
    custOrderId = $('trackId').value; custName = $('trackName').value.trim() || 'Customer';
    if (!custOrderId) return;
    socket.emit('track:order', custOrderId);
    socket.emit('chat:join', { orderId: custOrderId, name: custName, role: 'customer' });
  }
  async function rpc(method, params) {
    const r = await fetch(API + '/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', method, params, id: Date.now() }) });
    return r.json();
  }
  async function cancelOrder() {
    const res = await rpc('cancelOrder', { orderId: Number($('trackId').value) });
    $('rpcMsg').textContent = res.error ? 'Error: ' + res.error.message : 'Order cancelled via JSON-RPC.';
  }

  function addMsg(boxId, m) {
    $(boxId).insertAdjacentHTML('beforeend', `<div class="msg ${m.role}"><b>${m.from}:</b> ${m.text}</div>`);
    $(boxId).scrollTop = 99999;
  }
  function addSys(boxId, text) {
    if (boxId === 'custChat' && !custOrderId) return;
    if (boxId === 'agentChat' && !agentChatOrder) return;
    $(boxId).insertAdjacentHTML('beforeend', `<div class="sys">${text}</div>`);
  }
  function sendMsg(who) {
    const input = $(who === 'cust' ? 'custText' : 'agentText');
    const orderId = who === 'cust' ? custOrderId : agentChatOrder;
    if (!input.value.trim() || !orderId) return;
    socket.emit('chat:message', { orderId, text: input.value });
    input.value = '';
  }
  function typing(who) { socket.emit('chat:typing', { orderId: who === 'cust' ? custOrderId : agentChatOrder }); }

  function agentJoin() { socket.emit('agent:join'); }
  async function refreshAgentOrders() { renderAgentOrders(await (await fetch(API + '/api/v1/orders')).json()); }
  function renderAgentOrders(list) {
    $('agentOrders').innerHTML = list.map(o => `<div class="card">#${o.id} - ${o.customerName} - Rs ${o.total}
      <span class="badge">${o.status}</span><br>
      ${['Processing', 'Shipped', 'Delivered'].map(st => `<button class="act" onclick="setStatus(${o.id},'${st}')">${st}</button>`).join('')}
      <button class="act danger" onclick="agentCancel(${o.id})">Cancel (RPC)</button></div>`).join('') || '<p>No orders yet.</p>';
  }
  async function setStatus(id, status) {
    await fetch(`${API}/api/v1/orders/${id}/status`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
  }
  async function agentCancel(id) { const r = await rpc('cancelOrder', { orderId: id }); if (r.error) alert(r.error.message); }
  function agentOpenChat() {
    agentChatOrder = $('agentOrderId').value; if (!agentChatOrder) return;
    $('agentChat').innerHTML = '';
    socket.emit('chat:join', { orderId: agentChatOrder, name: agentName, role: 'agent' });
  }

  function startSSE() {
    const es = new EventSource(API + '/events');
    es.addEventListener('alert', e => {
      const a = JSON.parse(e.data);
      $('alertList').insertAdjacentHTML('afterbegin', `<div class="alert ${a.level}">[${new Date(a.time).toLocaleTimeString()}] ${a.message}</div>`);
    });
  }
</script>
</body>
</html>
